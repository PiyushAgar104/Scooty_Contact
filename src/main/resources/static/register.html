<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Scooty Contact</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand"><span class="brand-mark">SC</span><span>SCOOTY CONTACT</span></div><p class="eyebrow">CREATE YOUR ACCOUNT</p><h1>Join the portal</h1><p class="subtle">Use a strong password with at least 8 characters.</p><form onsubmit="submitAuth(event,'/api/auth/register','/login.html')"><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="120"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div><div id="message" class="message"></div><button class="button" type="submit">Create account</button></form><p class="foot">Already registered? <a href="/login.html">Sign in</a></p></section></main><script src="/auth.js"></script></body></html>

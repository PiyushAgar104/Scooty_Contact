spring:
  application:
    name: scooty-contact
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scooty_contact?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:configure-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
            scope: openid,profile,email
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      timeout: 30m

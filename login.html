<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Scooty Contact</title><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand"><span class="brand-mark">SC</span><span>SCOOTY CONTACT</span></div><p class="eyebrow">SECURE OWNER PORTAL</p><h1>Welcome back</h1><p class="subtle">Sign in to manage your scooter contact profile.</p><form onsubmit="submitAuth(event,'/api/auth/login','/dashboard.html')"><div class="field"><label for="username">Email address</label><input id="username" name="username" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="message" class="message"></div><button class="button" type="submit">Sign in</button></form><div class="divider">OR</div><a class="google" href="/oauth2/authorization/google">Continue with Google</a><p class="foot">New here? <a href="/register.html">Create an account</a></p></section></main><script src="/auth.js"></script></body></html>
